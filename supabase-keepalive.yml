# Menjaga project Supabase (paket Free) agar tidak di-pause karena sepi aktivitas.
# Simpan di repo dengan path: .github/workflows/supabase-keepalive.yml
# Wajib: buat secret SUPABASE_ANON_KEY di Settings > Secrets and variables > Actions.
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '17 3 * * *'   # tiap hari 03:17 UTC
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query kecil ke database
        env:
          SUPABASE_URL: https://gdfvzfqherygmiqyvvsy.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for t in master_units master_materials weather_daily; do
            curl -fsS --retry 3 --retry-delay 10 -o /dev/null \
              -w "$t -> HTTP %{http_code}\n" \
              "$SUPABASE_URL/rest/v1/$t?select=*&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          done
